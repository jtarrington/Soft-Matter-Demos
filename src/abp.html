<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Brownian Particles</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html,

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: scroll;
            justify-items: center;
        }

        canvas {
            display: block;
            width: 1000px;
            height: 1000px;
            background-color: #ffffff;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .divider {
            font-size: 30px;
            display: flex;
            align-items: center;
            padding: 3px;
            background-color: #9fc2d7;
        }

        .divider::before,
        .divider::after {
            flex: 1;
            content: '';
            padding: 3px;
            background-color: black;
            margin: 5px
        }

        .columns-container {
            width: 100%;
            flex: 1;
            display: flex;
        }

        .column {
            flex: 1;
            padding: 20px;
            border: 2px solid #878787;
            font-size: 20px;
            background-color: #c9e1ff;
            align-items: center;
        }

        .columns-container-debug {
            width: 100%;
            flex: 1;
            display: flex;
        }

        .column-debug {
            flex: 1;
            padding: 20px;
            border: 2px solid #878787;
            font-size: 20px;
            background-color: #55ff00;
        }


        .slider {
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
    <!-- <script type="module" src="/src/abp_sandbox.js"> -->
</head>

<body>
    <div class="divider"> Active Brownian Particles: Microscopic Traffic Jam </div>
    <div class="canvas-container"><canvas id="myCanvas" resize></canvas></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <script src="./abp.js"></script>
</body>

</html>
